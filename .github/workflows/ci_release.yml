name: ci-and-auto-publish

on:
  push:
    branches: ["**"] # CI sur toutes les branches
  pull_request: # CI sur toutes les PR
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CRATE_NAME: "symbolic_text"

jobs:
  ci:
    # CI on all branches and pull requests (PR + push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: build (locked)
        run: cargo build --workspace --all-features --locked --release

      - name: test (locked)
        run: cargo test  --workspace --all-features --locked

  publish:
    # CD (publish) ONLY on push to main in your organization
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository_owner == 'organization-ai-projects'
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Get the target crate version from the workspace
      - name: Determine crate version
        id: v
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          VER=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="'"$CRATE_NAME"'") | .version')
          if [ -z "$VER" ] || [ "$VER" = "null" ]; then
            echo "Crate $CRATE_NAME introuvable dans le workspace."; exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Detected $CRATE_NAME@$VER"

      # Skip if already published (avoids 409 error)
      - name: Check if version already on crates.io
        id: check
        run: |
          set -e
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://crates.io/api/v1/crates/${CRATE_NAME}/${{ steps.v.outputs.version }}")
          echo "http_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Crates.io response: $CODE"

      - name: Publish dry-run
        if: steps.check.outputs.http_code != '200'
        run: cargo publish -p "$CRATE_NAME" --dry-run --locked

      - name: Publish to crates.io
        if: steps.check.outputs.http_code != '200'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p "$CRATE_NAME" --locked
